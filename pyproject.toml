[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "glymorph"
version = "0.2.0"
description = "Configurable stroke-length and scaling variants for xiongzai v6 gfont files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
glymorph = "glymorph.cli:main"

[tool.setuptools.packages.find]
include = ["glymorph*"]
